<div class="row">
  <div class="col-md-3 mb-5 animate__animated animate__bounceInUp" *ngFor="let movie of movies">

    <img [src]="movie.poster_path | poster"
         class="img-fluid poster"
         (click)="onMovieClick(movie)"
    >

    <div>
      <h3>{{movie.title}}</h3>

      <div class="row">
        <div class="col-10">
          <star-rating [value]="movie.vote_average"
                       totalstars="10"
                       checkedcolor="yellow"
                       uncheckedcolor="gray"
                       size="18px"
                       readonly="false"
          ></star-rating>
        </div>

        <div class="col-2 text-white font-weight-bold">
          {{movie.vote_average | number:'1.1-2'}}
        </div>

      </div>
    </div>

  </div>
</div>
